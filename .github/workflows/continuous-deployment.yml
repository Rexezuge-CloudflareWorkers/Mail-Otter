name: Continuous Deployment

permissions:
  contents: read

on:
  workflow_run:
    workflows:
      - Continuous Integration
    branches:
      - main
    types:
      - completed
  repository_dispatch:
    types:
      - Upstream Sync Deployment
  workflow_dispatch:

concurrency:
  group: continuous-deployment-${{ github.event.workflow_run.head_branch || github.event.client_payload.branch || github.ref }}
  cancel-in-progress: false

jobs:
  deploy-worker:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.client_payload.sha || github.sha }}

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Prepare Wrangler Configuration
        uses: ./.github/actions/retry-step
        with:
          command: pnpm exec tsx scripts/prepare-wrangler-config.ts
          max_attempts: '3'
        env:
          WRANGLER_JSONC: ${{ vars.WRANGLER_JSONC }}
          WRANGLER_PATCH_JSON: ${{ vars.WRANGLER_PATCH_JSON }}
          WRANGLER_VARS_PATCH_JSON: ${{ vars.WRANGLER_VARS_PATCH_JSON }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Initialize Cloudflare Secrets
        uses: ./.github/actions/retry-step
        with:
          command: pnpm exec tsx scripts/init-secrets.ts
          max_attempts: '3'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply Database Migration
        uses: ./.github/actions/retry-step
        with:
          command: pnpm exec wrangler d1 migrations apply --remote mail-otter-db
          max_attempts: '3'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build Web App
        run: pnpm --filter @mail-otter/web build

      - name: Deploy with Wrangler
        uses: ./.github/actions/retry-step
        with:
          command: pnpm exec wrangler deploy --dry-run && pnpm exec wrangler deploy
          max_attempts: '3'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-pages:
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || github.event.workflow_run.conclusion == 'success') && vars.CLOUDFLARE_PAGES_PROJECT_NAME != '' }}
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.client_payload.sha || github.sha }}

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Build Frontend
        run: pnpm --filter @mail-otter/web build

      - name: Configure Pages Service Bindings
        run: cp apps/web/wrangler.template.jsonc wrangler.jsonc
        env:
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}

      - name: Deploy with Wrangler Pages
        uses: ./.github/actions/retry-step
        with:
          command: >
            pnpm exec wrangler pages deploy
            --project-name "${CLOUDFLARE_PAGES_PROJECT_NAME}"
            --branch "${DEPLOY_BRANCH}"
            --commit-hash "${DEPLOY_SHA}"
            --commit-message "$(git log -1 --pretty=%s)"
          max_attempts: '3'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch || github.event.client_payload.branch || github.ref_name }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.event.client_payload.sha || github.sha }}
